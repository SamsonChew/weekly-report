<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mlf-qyas-junjie · Week 1 周报</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
  /* ────────────────────────────────────────────────
     Design tokens
  ──────────────────────────────────────────────── */
  :root {
    --bg:           #f6f8fa;
    --panel:        #ffffff;
    --border:       #d0d7de;
    --border-light: #eaeef2;
    --text:         #1f2328;
    --muted:        #57606a;
    --subtle:       #6e7781;
    --accent:       #0969da;
    --accent-bg:    #ddf4ff;
    --danger:       #cf222e;
    --code-bg:      #f6f8fa;
    --quote-bg:     #f6f8fa;
    --tag-bg:       #eaeef2;
    --topbar-h:     56px;
    --toc-w:        230px;
    --content-max:  760px;
  }

  /* ────────────────────────────────────────────────
     Reset & base
  ──────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.65;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ────────────────────────────────────────────────
     Topbar
  ──────────────────────────────────────────────── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 200;
    height: var(--topbar-h);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: stretch;
    padding: 0 28px;
    gap: 0;
    box-shadow: 0 1px 0 var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    padding-right: 28px;
    border-right: 1px solid var(--border-light);
    margin-right: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .brand-icon {
    width: 22px; height: 22px;
    background: linear-gradient(135deg, #0969da 0%, #218bff 100%);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #fff; font-weight: 700; flex-shrink: 0;
  }

  .brand-sub {
    font-weight: 400;
    color: var(--muted);
  }

  /* Underline tab style */
  .tabs {
    display: flex;
    align-items: stretch;
    gap: 0;
    flex: 1;
  }

  .tab-btn {
    position: relative;
    background: none;
    border: none;
    padding: 0 16px;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: color 0.15s;
    white-space: nowrap;
    border-radius: 0;
  }

  .tab-btn::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 8px; right: 8px;
    height: 2px;
    background: transparent;
    border-radius: 2px 2px 0 0;
    transition: background 0.15s;
  }

  .tab-btn:hover { color: var(--text); }
  .tab-btn:hover::after { background: var(--border); }

  .tab-btn.active { color: var(--text); }
  .tab-btn.active::after { background: #fd8c73; }

  .tab-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--tag-bg);
    color: var(--muted);
    font-size: 11px;
    font-weight: 500;
    padding: 1px 6px;
    border-radius: 20px;
    min-width: 20px;
  }

  /* ────────────────────────────────────────────────
     Page layout
  ──────────────────────────────────────────────── */
  .page-layout {
    display: flex;
    max-width: calc(var(--content-max) + var(--toc-w) + 96px);
    margin: 0 auto;
    padding: 0 32px;
    align-items: flex-start;
  }

  /* Content column */
  .content-col {
    flex: 1;
    min-width: 0;
    border-right: 1px solid var(--border-light);
    padding-right: 48px;
  }

  .report {
    display: none;
    padding: 36px 0 80px;
  }
  .report.active { display: block; }

  /* Loading state */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 80px 0;
    color: var(--muted);
    font-size: 14px;
  }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .err-msg { color: var(--danger); font-size: 14px; text-align: center; padding: 40px 0; }
  .err-msg small { display: block; margin-top: 6px; color: var(--muted); font-size: 13px; }

  /* ────────────────────────────────────────────────
     TOC sidebar
  ──────────────────────────────────────────────── */
  .toc-col {
    width: var(--toc-w);
    flex-shrink: 0;
    padding-left: 32px;
  }

  .toc-sticky {
    position: sticky;
    top: calc(var(--topbar-h) + 28px);
    max-height: calc(100vh - var(--topbar-h) - 56px);
    overflow-y: auto;
    overflow-x: hidden;
    /* hide scrollbar but keep functionality */
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .toc-sticky::-webkit-scrollbar { width: 4px; }
  .toc-sticky::-webkit-scrollbar-track { background: transparent; }
  .toc-sticky::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .toc-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--subtle);
    margin-bottom: 10px;
    padding-left: 8px;
  }

  .toc-list {
    list-style: none;
  }

  .toc-item a {
    display: block;
    padding: 3px 8px;
    font-size: 12.5px;
    color: var(--muted);
    text-decoration: none;
    border-left: 2px solid var(--border-light);
    line-height: 1.45;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
    border-radius: 0 4px 4px 0;
  }

  .toc-item a:hover {
    color: var(--text);
    background: var(--bg);
    border-left-color: var(--border);
  }

  /* depth levels */
  .toc-item.d3 a { padding-left: 18px; font-size: 12px; }
  .toc-item.d4 a { padding-left: 28px; font-size: 11.5px; color: var(--subtle); }

  /* active state */
  .toc-item.is-active > a {
    color: var(--accent);
    border-left-color: var(--accent);
    font-weight: 500;
    background: var(--accent-bg);
  }

  /* empty / hidden TOC */
  .toc-empty {
    font-size: 12px;
    color: var(--subtle);
    padding-left: 8px;
    font-style: italic;
  }

  /* ────────────────────────────────────────────────
     Markdown body
  ──────────────────────────────────────────────── */
  .markdown-body {
    color: var(--text);
    max-width: var(--content-max);
  }

  /* Headings */
  .markdown-body h1,
  .markdown-body h2,
  .markdown-body h3,
  .markdown-body h4,
  .markdown-body h5 {
    font-weight: 600;
    line-height: 1.25;
    scroll-margin-top: calc(var(--topbar-h) + 20px);
  }

  .markdown-body h1 {
    font-size: 1.85em;
    margin: 0 0 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .markdown-body h2 {
    font-size: 1.35em;
    margin: 44px 0 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-light);
  }

  .markdown-body h3 {
    font-size: 1.1em;
    margin: 32px 0 10px;
    color: var(--text);
  }

  .markdown-body h4 {
    font-size: 0.95em;
    margin: 24px 0 8px;
    color: var(--text);
  }

  .markdown-body h5 {
    font-size: 0.875em;
    margin: 20px 0 6px;
    color: var(--muted);
  }

  /* Paragraphs & inline */
  .markdown-body p { margin: 0 0 16px; }
  .markdown-body strong { font-weight: 600; color: var(--text); }
  .markdown-body em { font-style: italic; color: var(--muted); }
  .markdown-body del { color: var(--subtle); }

  /* Links */
  .markdown-body a { color: var(--accent); text-decoration: none; }
  .markdown-body a:hover { text-decoration: underline; }

  /* Lists */
  .markdown-body ul,
  .markdown-body ol {
    padding-left: 1.75em;
    margin: 0 0 16px;
  }
  .markdown-body li { margin: 5px 0; }
  .markdown-body li > p { margin: 0; }
  .markdown-body li + li { margin-top: 5px; }

  /* Blockquotes */
  .markdown-body blockquote {
    margin: 0 0 16px;
    padding: 10px 16px;
    border-left: 4px solid var(--accent);
    background: var(--accent-bg);
    border-radius: 0 6px 6px 0;
    color: var(--muted);
  }
  .markdown-body blockquote > :first-child { margin-top: 0; }
  .markdown-body blockquote > :last-child  { margin-bottom: 0; }

  /* HR */
  .markdown-body hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 28px 0;
  }

  /* Images */
  .markdown-body img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 20px auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  /* Inline code */
  .markdown-body code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 85%;
    padding: 0.15em 0.4em;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: #cf222e;
  }

  /* Code blocks */
  .markdown-body pre {
    margin: 0 0 20px;
    padding: 0;
    overflow: hidden;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  .markdown-body pre code {
    display: block;
    padding: 16px 20px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.5;
    background: transparent;
    border: none;
    border-radius: 0;
    color: var(--text);
  }

  /* Tables */
  .markdown-body table {
    border-collapse: collapse;
    margin: 0 0 20px;
    display: block;
    width: max-content;
    max-width: 100%;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .markdown-body table th,
  .markdown-body table td {
    border: none;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border-light);
    padding: 8px 14px;
    text-align: left;
    vertical-align: top;
    font-size: 14px;
  }

  .markdown-body table th {
    background: var(--code-bg);
    font-weight: 600;
    font-size: 13px;
  }

  .markdown-body table tr:last-child td { border-bottom: none; }
  .markdown-body table th:last-child,
  .markdown-body table td:last-child { border-right: none; }

  .markdown-body table tbody tr:hover { background: var(--bg); }

  /* ────────────────────────────────────────────────
     Responsive — hide TOC on narrow screens
  ──────────────────────────────────────────────── */
  @media (max-width: 900px) {
    .toc-col { display: none; }
    .content-col { border-right: none; padding-right: 0; }
    .page-layout { padding: 0 20px; }
  }

  @media (max-width: 600px) {
    .page-layout { padding: 0 14px; }
    .brand-sub { display: none; }
    .report { padding: 24px 0 60px; }
    .markdown-body h1 { font-size: 1.4em; }
    .markdown-body h2 { font-size: 1.15em; }
    .topbar { padding: 0 14px; }
    .tab-btn { padding: 0 10px; font-size: 13px; }
  }
  </style>
</head>
<body>

<!-- ── Topbar ── -->
<header class="topbar">
  <span class="brand">
    <span class="brand-icon">W1</span>
    mlf-qyas-junjie
    <span class="brand-sub">· Week 1</span>
  </span>
  <nav class="tabs">
    <button class="tab-btn" data-target="deeplob" data-src="week1_report.md">
      DeepLOB
      <span class="tab-badge">Week 1</span>
    </button>
    <button class="tab-btn" data-target="quantalpha" data-src="week1_quantalpha.md">
      QuantaAlpha
      <span class="tab-badge">Week 1</span>
    </button>
  </nav>
</header>

<!-- ── Page body ── -->
<div class="page-layout">

  <!-- Content column -->
  <div class="content-col">
    <div class="report" id="deeplob">
      <div class="loading"><div class="spinner"></div>Loading…</div>
    </div>
    <div class="report" id="quantalpha">
      <div class="loading"><div class="spinner"></div>Loading…</div>
    </div>
  </div>

  <!-- TOC sidebar -->
  <aside class="toc-col" aria-label="On this page">
    <div class="toc-sticky">
      <p class="toc-label">On this page</p>
      <div id="toc-content">
        <p class="toc-empty">Loading…</p>
      </div>
    </div>
  </aside>

</div>

<script>
(function () {
  'use strict';

  marked.use({ gfm: true, breaks: false });

  /* ── helpers ── */
  function slugify(text) {
    return text
      .toLowerCase()
      .replace(/[一-鿿]/g, function(c) { return c; }) // keep CJK
      .replace(/[^\w一-鿿\s-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-{2,}/g, '-')
      .replace(/^-|-$/g, '');
  }

  /* ── TOC builder ── */
  function buildToc(articleEl) {
    var tocEl = document.getElementById('toc-content');
    var headings = Array.from(articleEl.querySelectorAll('h2, h3, h4'));

    if (headings.length === 0) {
      tocEl.innerHTML = '<p class="toc-empty">No sections</p>';
      return;
    }

    // Assign IDs
    var seen = {};
    headings.forEach(function(h) {
      var base = slugify(h.textContent.trim()) || 'section';
      seen[base] = (seen[base] || 0) + 1;
      h.id = seen[base] > 1 ? base + '-' + seen[base] : base;
    });

    // Build list
    var items = headings.map(function(h) {
      var level = parseInt(h.tagName[1], 10);
      var depthClass = level === 3 ? ' d3' : level === 4 ? ' d4' : '';
      return '<li class="toc-item' + depthClass + '" data-id="' + h.id + '">' +
             '<a href="#' + h.id + '">' + h.textContent.trim() + '</a></li>';
    });

    tocEl.innerHTML = '<ul class="toc-list">' + items.join('') + '</ul>';
    setupActiveTracking(articleEl, tocEl);
  }

  /* ── Active section tracking ── */
  function setupActiveTracking(articleEl, tocEl) {
    var headings = Array.from(articleEl.querySelectorAll('h2, h3, h4'));
    var tocItems = Array.from(tocEl.querySelectorAll('.toc-item'));
    var rafId = null;
    var topbarH = parseInt(getComputedStyle(document.documentElement)
                            .getPropertyValue('--topbar-h'), 10) || 56;

    function update() {
      var scrollY = window.scrollY;
      var viewTop = scrollY + topbarH + 20;

      // Find the last heading above viewTop
      var activeId = null;
      for (var i = 0; i < headings.length; i++) {
        if (headings[i].offsetTop <= viewTop) {
          activeId = headings[i].id;
        } else {
          break;
        }
      }

      tocItems.forEach(function(item) {
        var isActive = item.dataset.id === activeId;
        if (isActive && !item.classList.contains('is-active')) {
          tocItems.forEach(function(t) { t.classList.remove('is-active'); });
          item.classList.add('is-active');
          // scroll toc to keep active item visible
          var tocSticky = document.querySelector('.toc-sticky');
          if (tocSticky) {
            var itemTop = item.offsetTop - tocSticky.offsetTop;
            var visible = tocSticky.scrollTop;
            var height  = tocSticky.clientHeight;
            if (itemTop < visible || itemTop > visible + height - 40) {
              tocSticky.scrollTop = itemTop - height / 2;
            }
          }
        } else if (!isActive) {
          item.classList.remove('is-active');
        }
      });
    }

    window.addEventListener('scroll', function() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(update);
    }, { passive: true });

    update();

    // TOC click: smooth scroll
    tocEl.addEventListener('click', function(e) {
      var a = e.target.closest('a');
      if (!a) return;
      e.preventDefault();
      var target = document.getElementById(a.getAttribute('href').slice(1));
      if (target) {
        var y = target.getBoundingClientRect().top + window.scrollY - topbarH - 16;
        window.scrollTo({ top: y, behavior: 'smooth' });
        if (history.replaceState) history.replaceState(null, '', a.getAttribute('href'));
      }
    });
  }

  /* ── Markdown loader ── */
  var cache = {};

  async function loadMd(src) {
    if (cache[src]) return cache[src];
    var resp = await fetch(src);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    var text = await resp.text();
    cache[src] = marked.parse(text);
    return cache[src];
  }

  /* ── Tab switching ── */
  var buttons = document.querySelectorAll('.tab-btn');
  var panels  = document.querySelectorAll('.report');

  async function activate(id) {
    buttons.forEach(function(b) { b.classList.toggle('active', b.dataset.target === id); });
    panels.forEach(function(p) { p.classList.toggle('active', p.id === id); });
    window.scrollTo({ top: 0, behavior: 'instant' });
    if (history.replaceState) history.replaceState(null, '', '#' + id);

    var panel = document.getElementById(id);
    var btn   = document.querySelector('.tab-btn[data-target="' + id + '"]');
    if (!btn) return;

    // Already rendered
    if (panel.dataset.loaded) {
      var article = panel.querySelector('.markdown-body');
      if (article) buildToc(article);
      return;
    }

    try {
      var html = await loadMd(btn.dataset.src);
      panel.innerHTML = '<article class="markdown-body">' + html + '</article>';
      panel.dataset.loaded = '1';

      // Syntax highlight
      panel.querySelectorAll('pre code').forEach(function(el) {
        hljs.highlightElement(el);
      });

      // Build TOC
      buildToc(panel.querySelector('.markdown-body'));

    } catch (err) {
      panel.innerHTML = '<div class="err-msg">Failed to load report: ' + err.message +
        '<small>This page needs to be served over HTTP (GitHub Pages, local server).<br>' +
        'It cannot be opened as a <code>file://</code> URL.</small></div>';
      document.getElementById('toc-content').innerHTML =
        '<p class="toc-empty">—</p>';
    }
  }

  buttons.forEach(function(b) {
    b.addEventListener('click', function() { activate(b.dataset.target); });
  });

  var hash   = location.hash.replace('#', '');
  var initId = document.getElementById(hash) ? hash : buttons[0].dataset.target;
  activate(initId);
})();
</script>
</body>
</html>
